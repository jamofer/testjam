[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testjam-client"
version = "1.0.1"
description = "Python SDK and Robot Framework listener for the Testjam test management server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Framework :: Robot Framework",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.7",
    "click-repl>=0.3",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]
robot-listener = [
    "robotframework>=7.0",
]
all = [
    "typer>=0.12",
    "rich>=13.7",
    "click-repl>=0.3",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "robotframework>=7.0",
]
dev = [
    "pytest>=8.0",
    "fastapi[standard]>=0.115",
    "typer>=0.12",
    "rich>=13.7",
    "click-repl>=0.3",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "robotframework>=7.0",
]

[project.scripts]
testjam = "testjam_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["testjam_client", "testjam_listener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
