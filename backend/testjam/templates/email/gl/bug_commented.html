{% extends "_layout.html" %}
{% block content %}
<p style="font-size: 16px; line-height: 1.5;">
  <strong>{{ actor }}</strong> comentou en <strong>{{ subject_object }}</strong>.
</p>
<blockquote style="border-left: 3px solid #e5e7eb; padding: 6px 12px; color: #4b5563; margin: 16px 0;">
  {{ excerpt }}
</blockquote>
<p style="margin: 24px 0;">
  <a href="{{ link_in_app }}" style="display: inline-block; background: #2563eb; color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none;">
    Abrir o bug
  </a>
</p>
{% endblock %}
