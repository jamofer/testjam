[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testjam-api"
version = "1.1.2"
description = "Testjam test management platform — backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.0",
    "Jinja2>=3.1.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.18.0",
    "redis>=5.2.0",
    "cryptography>=43.0.0",
    "httpx>=0.28.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "fakeredis>=2.26.0",
    "ruff>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["testjam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests are function-based; disabling class collection silences PytestCollectionWarning
# from SQLAlchemy models named TestExecution / TestResult / TestSuite / TestCase / ...
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI declares dependencies as call defaults: `db: Session = Depends(get_db)`.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Logging and Sentry must be configured before the routers are imported.
"testjam/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["testjam", "tests"]
