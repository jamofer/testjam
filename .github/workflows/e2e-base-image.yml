name: E2E base image

on:
  push:
    branches: [master]
    paths:
      - "tests/e2e/Dockerfile.base"
      - "testjam-client/pyproject.toml"
      - "tests/e2e/pyproject.toml"
      - ".github/workflows/e2e-base-image.yml"
  workflow_dispatch:

concurrency:
  group: e2e-base-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build + push ghcr.io/.../testjam-e2e-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute content-hash tag
        id: base
        run: |
          digest=$(sha256sum \
            tests/e2e/Dockerfile.base \
            testjam-client/pyproject.toml \
            tests/e2e/pyproject.toml \
            | sha256sum | cut -c1-12)
          echo "digest=$digest" >> $GITHUB_OUTPUT
          echo "tagging base image as base-$digest"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/e2e/Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/testjam-e2e-base:latest
            ghcr.io/${{ github.repository_owner }}/testjam-e2e-base:base-${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=e2e-base
          cache-to: type=gha,scope=e2e-base,mode=max
