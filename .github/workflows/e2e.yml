name: E2E

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot:
    name: Robot Framework + Playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute e2e base image tag
        id: base
        run: |
          # Tag = sha256 of the files that define the base layer. Same inputs
          # → same tag, immutable. Avoids races with parallel
          # `e2e-base-image` rebuilds mutating `:latest`, and lets PRs reuse
          # the base that master already published when inputs haven't changed.
          digest=$(sha256sum \
            tests/e2e/Dockerfile.base \
            testjam-client/pyproject.toml \
            tests/e2e/pyproject.toml \
            | sha256sum | cut -c1-12)
          tag="ghcr.io/${{ github.repository_owner }}/testjam-e2e-base:base-$digest"
          echo "E2E_BASE=$tag" >> $GITHUB_ENV
          echo "e2e base image tag: $tag"

      - name: Ensure e2e base image is published to GHCR
        run: |
          if ! docker buildx imagetools inspect "$E2E_BASE" >/dev/null 2>&1; then
            echo "base image $E2E_BASE not in GHCR yet, building + pushing"
            docker buildx build \
              -f tests/e2e/Dockerfile.base \
              --push \
              -t "$E2E_BASE" .
          fi

      - name: Build images
        run: docker compose -f docker-compose-dev.yml -f docker-compose-ci.yml --profile e2e build

      - name: Start stack
        run: docker compose -f docker-compose-dev.yml up -d --wait db api frontend mailpit

      - name: Seed admin user
        run: make admin

      - name: Run listener tests
        run: make test-listener

      - name: Run orchestrator tests
        run: make test-orchestrator

      - name: Run e2e via orchestrator
        run: make test-e2e POOL=4

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/e2e/results
            tests/e2e/log.html
            tests/e2e/output.xml
            tests/e2e/report.html
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-dev.yml down -v
